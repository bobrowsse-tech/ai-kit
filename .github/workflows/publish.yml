# Publish @bobrowsse-tech/ai-kit to npm when a GitHub Release is published.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@bobrowsse-tech"

      - name: Install workspaces
        run: npm install

      - name: Hermetic tests
        run: npm test

      - name: Publish CLI package
        run: npm publish -w @bobrowsse-tech/ai-kit --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
